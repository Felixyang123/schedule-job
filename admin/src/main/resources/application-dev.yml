server:
  port: 8100

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/job?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: lifan1994

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.wly.job.server: debug
    org.mybatis: ERROR
    com.wly.job.server.dao.mapper: ERROR

instance-client:
  serverAddress: http://localhost:8080
  accessToken: defaultToken
  env: dev
  appname: ${spring.application.name}
  port: ${server.port}

schedule:
  registry: DEFAULT
  service: GROUP
  enableRegisterInstance: true
  engine: DELAY_QUEUE
  dispatch-threads: 1
  access-token: defaultToken
  ha:
    enabled: false
    election: DB
    lease-seconds: 10
    renew-seconds: 3
    poll-seconds: 1
    stale-sweep-seconds: 30

cors:
  allowed-origins: "*"
