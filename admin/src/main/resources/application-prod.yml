server:
  port: 8100

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.wly.job.server: info
    org.mybatis: ERROR
    com.wly.job.server.dao.mapper: ERROR

instance-client:
  serverAddress: ${REGISTRY_CENTER_URL}
  accessToken: ${REGISTRY_ACCESS_TOKEN}
  env: ${REGISTRY_ENV}
  appname: ${spring.application.name}
  port: ${server.port}

schedule:
  registry: DEFAULT
  service: GROUP
  enableRegisterInstance: true
  engine: DELAY_QUEUE
  dispatch-threads: 1
  access-token: ${SCHEDULE_ACCESS_TOKEN}
  ha:
    enabled: ${SCHEDULE_HA_ENABLED:false}
    election: ${SCHEDULE_HA_ELECTION:DB}
    lease-seconds: ${SCHEDULE_HA_LEASE_SECONDS:10}
    renew-seconds: ${SCHEDULE_HA_RENEW_SECONDS:3}
    poll-seconds: ${SCHEDULE_HA_POLL_SECONDS:1}
    stale-sweep-seconds: ${SCHEDULE_HA_STALE_SWEEP_SECONDS:30}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
