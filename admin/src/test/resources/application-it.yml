# 集成测试专用 profile（@ActiveProfiles("it")）：
# 连接独立测试库 job_test，避免污染本地开发库 job。
# IT 使用持久化实例存储，不配置 schedule.refresh-storage=REDIS；
# RedisJobInstanceStorage 按该配置条件装配和启动，因此测试上下文无需真实 Redis。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/job_test?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: lifan1994

schedule:
  registry: DEFAULT
  service: GROUP
  enableRegisterInstance: true
  engine: DELAY_QUEUE
  dispatch-threads: 1
  access-token: defaultToken
  ha:
    enabled: false
    election: DB
    lease-seconds: 10
    renew-seconds: 3
    poll-seconds: 1
    stale-sweep-seconds: 30

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.wly.job.server: WARN
    org.mybatis: ERROR
    com.wly.job.server.dao.mapper: ERROR
