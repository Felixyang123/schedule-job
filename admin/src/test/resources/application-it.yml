# 集成测试专用 profile（@ActiveProfiles("it")）：
# 连接独立测试库 job_test，避免污染本地开发库 job。
# IT 使用持久化实例存储，不配置 schedule.refresh-storage=REDIS；
# RedisJobInstanceStorage 按该配置条件装配和启动，因此测试上下文无需真实 Redis。
login:
  props:
    auth-model: job-local
    mode: none
    storage: local
    token-header-key: Authorization
    jwt-secret: test-jwt-secret-with-at-least-32-bytes-123456
    jwt-issuer: job-admin-test

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/job_test?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: lifan1994

schedule:
  admin:
    # 集成测试只验证 Spring 配置和 Web 过滤器，不触发本地账号建表/引导
    bootstrap-enabled: false
  registry: DEFAULT
  service: GROUP
  enableRegisterInstance: true
  engine: DELAY_QUEUE
  dispatch-threads: 1
  credential-seed: it-app:it-env:defaultToken
  ha:
    enabled: false
    election: DB
    lease-seconds: 10
    renew-seconds: 3
    poll-seconds: 1
    stale-sweep-seconds: 30

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.wly.job.server: WARN
    org.mybatis: ERROR
    com.wly.job.server.dao.mapper: ERROR
