spring:
  application:
    name: job-sample-server

server:
  port: 8102

schedule-job:
  # 多 Admin 地址用逗号分隔（如 http://a:8100,http://b:8100）；单地址保持原样
  serverAddress: http://localhost:8100
  # Admin 节点选择算法: ROUND_ROBIN（默认）/ RANDOM / HASH
  serverSelector: ROUND_ROBIN
  # 应用身份（凭证体系，ADR-0006）：必填；组模式下兼作实例发现键
  application-name: ${spring.application.name}
  # 本应用明文凭证：与 Admin 侧 schedule.credential-seed 中该身份对应
  accessToken: defaultToken
  port: 8101
  heartbeatInterval: 10
  group:
    enabled: true

logging:
  level:
    root: INFO
    com.wly.job: DEBUG

## 注册中心配置
instance-client:
  serverAddress: http://localhost:8080
  accessToken: defaultToken
  env: dev
  port: ${schedule-job.port}
  appname: ${spring.application.name}
