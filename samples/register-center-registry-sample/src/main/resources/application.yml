spring:
  application:
    name: register-center-sample-server

server:
  port: 8103

schedule-job:
  serverAddress: http://localhost:8100
  # 应用身份（凭证体系，ADR-0006）：必填；组模式下兼作实例发现键
  application-name: ${spring.application.name}
  accessToken: defaultToken
  port: 8104
  heartbeatInterval: 10
  group:
    enabled: true

logging:
  level:
    root: INFO
    com.wly.job: DEBUG

## 注册中心配置
instance-client:
  serverAddress: http://localhost:8080
  accessToken: defaultToken
  env: dev
  port: ${server.port}
  appname: ${spring.application.name}